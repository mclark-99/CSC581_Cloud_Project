apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepix-image-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubepix-image-processor
  template:
    metadata:
      labels:
        app: kubepix-image-processor
    spec:
      containers:
        - name: image-processor
          image: kubepix-image-processor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002