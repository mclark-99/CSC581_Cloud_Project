apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepix-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubepix-frontend
  template:
    metadata:
      labels:
        app: kubepix-frontend
    spec:
      containers:
        - name: frontend
          image: kubepix-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
      